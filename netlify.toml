# Despliegue en Netlify (se lee automáticamente al conectar el repositorio).
[build]
  command = "npm run build"
  publish = "dist/mr-sabueso/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta (/servicios, /admin, …) la resuelve Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Archivos con hash en el nombre: caché larga.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
